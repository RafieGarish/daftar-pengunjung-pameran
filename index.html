<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Pengunjung</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy-deepest: #020812;
    --navy-deep: #060e22;
    --navy-mid: #0a1832;
    --navy-surface: #0f2244;
    --navy-card: #112756;
    --blue-bright: #00c8ff;
    --blue-glow: #0088ff;
    --blue-accent: #3b7eff;
    --blue-soft: #1a4a8a;
    --cyan-neon: #00ffea;
    --white: #e8f4ff;
    --white-muted: #8ab4d4;
    --border-glow: rgba(0, 200, 255, 0.3);
    --border-dim: rgba(0, 100, 200, 0.2);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Rajdhani', sans-serif;
    background: var(--navy-deepest);
    color: var(--white);
    min-height: 100vh;
    height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,136,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,136,255,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* Radial glow center */
  body::after {
    content: '';
    position: fixed;
    top: -20%;
    left: 50%;
    transform: translateX(-50%);
    width: 800px;
    height: 600px;
    background: radial-gradient(ellipse, rgba(0,100,255,0.12) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .page-wrapper {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 30px;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 48px;
    position: relative;
  }

  .header-badge {
    display: inline-block;
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 3px;
    color: var(--blue-bright);
    background: rgba(0,200,255,0.08);
    border: 1px solid rgba(0,200,255,0.2);
    padding: 6px 18px;
    border-radius: 20px;
    margin-bottom: 20px;
    text-transform: uppercase;
    animation: pulse-badge 3s ease-in-out infinite;
  }

  @keyframes pulse-badge {
    0%, 100% { border-color: rgba(0,200,255,0.2); box-shadow: 0 0 0 rgba(0,200,255,0); }
    50% { border-color: rgba(0,200,255,0.5); box-shadow: 0 0 16px rgba(0,200,255,0.15); }
  }

  .header h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(26px, 5vw, 42px);
    font-weight: 900;
    letter-spacing: 2px;
    color: var(--white);
    line-height: 1.1;
    text-transform: uppercase;
  }

  .header h1 span {
    color: var(--blue-bright);
    text-shadow: 0 0 30px rgba(0,200,255,0.5);
  }

  .header-line {
    width: 120px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--blue-bright), transparent);
    margin: 18px auto 14px;
    animation: scan 3s linear infinite;
  }

  @keyframes scan {
    0% { opacity: 0.4; width: 60px; }
    50% { opacity: 1; width: 160px; }
    100% { opacity: 0.4; width: 60px; }
  }

  .header p {
    font-size: 16px;
    color: var(--white-muted);
    letter-spacing: 1px;
    font-weight: 400;
  }

  /* Main layout */
  .main-layout {
    width: 100%;
    max-width: 960px;
    display: grid;
    /* grid-template-columns: 1fr 1fr; */
    gap: 28px;
    align-items: start;
  }

  @media (max-width: 700px) {
    /* .main-layout { grid-template-columns: 1fr; } */
  }

  /* Cards */
  .card {
    background: linear-gradient(135deg, rgba(17,39,86,0.95) 0%, rgba(6,14,34,0.95) 100%);
    border: 1px solid var(--border-glow);
    border-radius: 16px;
    padding: 32px 28px;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--blue-bright), var(--cyan-neon), var(--blue-bright), transparent);
    animation: shimmer 4s linear infinite;
  }

  @keyframes shimmer {
    0% { opacity: 0.5; }
    50% { opacity: 1; }
    100% { opacity: 0.5; }
  }

  .card-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2.5px;
    color: var(--blue-bright);
    text-transform: uppercase;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .card-title::before {
    content: '';
    width: 8px; height: 8px;
    background: var(--blue-bright);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--blue-bright);
    flex-shrink: 0;
    animation: blink 2s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* Form */
  .form-group {
    margin-bottom: 22px;
  }

  .form-label {
    display: block;
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    color: var(--white-muted);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .badge-opsional {
    font-size: 10px;
    letter-spacing: 1px;
    color: var(--blue-bright);
    background: rgba(0,200,255,0.1);
    border: 1px solid rgba(0,200,255,0.2);
    padding: 2px 8px;
    border-radius: 4px;
    margin-left: 8px;
    vertical-align: middle;
    font-weight: 500;
  }

  .form-input {
    width: 100%;
    background: rgba(0,30,70,0.5);
    border: 1px solid var(--border-dim);
    border-radius: 8px;
    padding: 12px 16px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 16px;
    font-weight: 500;
    color: var(--white);
    outline: none;
    transition: all 0.3s ease;
    letter-spacing: 0.5px;
  }

  .form-input::placeholder {
    color: rgba(138,180,212,0.35);
    font-weight: 400;
  }

  .form-input:focus {
    border-color: var(--blue-bright);
    background: rgba(0,50,120,0.3);
    box-shadow: 0 0 0 3px rgba(0,200,255,0.08), inset 0 0 20px rgba(0,100,200,0.1);
  }

  .form-input:hover:not(:focus) {
    border-color: rgba(0,200,255,0.25);
  }

  /* Submit button */
  .btn-submit {
    width: 100%;
    background: linear-gradient(135deg, #0055cc 0%, #0088ff 50%, #00aaff 100%);
    border: none;
    border-radius: 8px;
    padding: 14px 24px;
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #fff;
    cursor: pointer;
    text-transform: uppercase;
    position: relative;
    overflow: hidden;
    transition: all 0.3s ease;
    margin-top: 8px;
  }

  .btn-submit::before {
    content: '';
    position: absolute;
    top: -50%; left: -60%;
    width: 40%; height: 200%;
    background: rgba(255,255,255,0.15);
    transform: skewX(-20deg);
    transition: left 0.5s ease;
  }

  .btn-submit:hover::before { left: 130%; }

  .btn-submit:hover {
    box-shadow: 0 0 28px rgba(0,150,255,0.5), 0 4px 16px rgba(0,0,0,0.4);
    transform: translateY(-1px);
  }

  .btn-submit:active { transform: translateY(0); }
  .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* Alert */
  .alert {
    margin-top: 16px;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.5px;
    display: none;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

  .alert.success {
    display: block;
    background: rgba(0,255,120,0.08);
    border: 1px solid rgba(0,255,120,0.25);
    color: #00ff88;
  }

  .alert.error {
    display: block;
    background: rgba(255,60,60,0.08);
    border: 1px solid rgba(255,60,60,0.25);
    color: #ff6060;
  }

  /* List panel */
  .list-panel {
    max-height: 520px;
    overflow-y: auto;
  }

  .list-panel::-webkit-scrollbar { width: 4px; }
  .list-panel::-webkit-scrollbar-track { background: transparent; }
  .list-panel::-webkit-scrollbar-thumb { background: var(--blue-glow); border-radius: 2px; }

  .counter-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border-dim);
  }

  .counter-label { font-size: 13px; color: var(--white-muted); letter-spacing: 1px; }
  .counter-num {
    font-family: 'Orbitron', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--blue-bright);
    text-shadow: 0 0 16px rgba(0,200,255,0.4);
  }

  /* Visitor item */
  .visitor-item {
    background: rgba(0,40,100,0.3);
    border: 1px solid rgba(0,100,200,0.15);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
    position: relative;
    overflow: hidden;
    animation: slideIn 0.4s ease;
    transition: border-color 0.2s;
  }

  .visitor-item:hover { border-color: rgba(0,200,255,0.3); }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-12px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .visitor-item::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: linear-gradient(180deg, var(--blue-bright), var(--cyan-neon));
    border-radius: 3px 0 0 3px;
  }

  .visitor-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--white);
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }

  .visitor-detail {
    font-size: 13px;
    color: var(--white-muted);
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 2px;
  }

  .visitor-detail .dot {
    width: 4px; height: 4px;
    background: var(--blue-bright);
    border-radius: 50%;
    flex-shrink: 0;
  }

  .visitor-minat {
    font-size: 12px;
    color: var(--cyan-neon);
    opacity: 0.8;
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
  }

  .visitor-time {
    position: absolute;
    top: 10px; right: 12px;
    font-size: 10px;
    color: rgba(138,180,212,0.4);
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 0.5px;
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--white-muted);
  }

  .empty-icon {
    font-size: 36px;
    opacity: 0.3;
    margin-bottom: 12px;
  }

  .empty-text {
    font-size: 14px;
    letter-spacing: 1px;
    opacity: 0.6;
  }

  /* Loading */
  .loading-spinner {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
    gap: 8px;
    color: var(--white-muted);
    font-size: 13px;
    letter-spacing: 1px;
  }

  .spinner {
    width: 18px; height: 18px;
    border: 2px solid rgba(0,200,255,0.2);
    border-top-color: var(--blue-bright);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Corner decorations */
  .corner-deco {
    position: absolute;
    width: 20px; height: 20px;
    border-color: rgba(0,200,255,0.3);
    border-style: solid;
  }

  .corner-deco.tl { top: 8px; left: 8px; border-width: 2px 0 0 2px; border-radius: 2px 0 0 0; }
  .corner-deco.tr { top: 8px; right: 8px; border-width: 2px 2px 0 0; border-radius: 0 2px 0 0; }
  .corner-deco.bl { bottom: 8px; left: 8px; border-width: 0 0 2px 2px; border-radius: 0 0 0 2px; }
  .corner-deco.br { bottom: 8px; right: 8px; border-width: 0 2px 2px 0; border-radius: 0 0 2px 0; }

  /* Config warning */
  .config-warning {
    background: rgba(255,165,0,0.08);
    border: 1px solid rgba(255,165,0,0.25);
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 28px;
    font-size: 13px;
    color: #ffbb44;
    letter-spacing: 0.3px;
    line-height: 1.6;
    width: 100%;
    max-width: 960px;
  }

  .config-warning strong {
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    letter-spacing: 2px;
    display: block;
    margin-bottom: 6px;
  }

  .config-warning code {
    font-family: monospace;
    background: rgba(255,165,0,0.12);
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 12px;
  }
</style>
</head>
<body>

<div class="page-wrapper">

  <!-- Config Warning -->
  <!-- <div class="config-warning" id="configWarning">
    <strong>⚙ KONFIGURASI FIREBASE</strong>
    Ganti nilai pada variabel <code>firebaseConfig</code> di bagian &lt;script&gt; dengan konfigurasi Firebase project Anda.
    Pastikan Firestore sudah diaktifkan di Firebase Console dan rule sudah mengizinkan write.
  </div> -->

  <!-- Header -->
  <div class="header">
    <div class="header-badge">Sistem Registrasi Digital</div>
    <h1>Daftar <span>Pengunjung RPL</span></h1>
    <div class="header-line"></div>
    <p>Silakan isi data Anda untuk registrasi kunjungan</p>
  </div>

  <!-- Main Layout -->
  <div class="main-layout">

    <!-- Form Card -->
    <div class="card">
      <div class="corner-deco tl"></div>
      <div class="corner-deco tr"></div>
      <div class="corner-deco bl"></div>
      <div class="corner-deco br"></div>

      <div class="card-title">Input Data Pengunjung</div>

      <div class="form-group">
        <label class="form-label" for="nama">Nama Lengkap</label>
        <input type="text" id="nama" class="form-input" placeholder="Masukkan nama lengkap Anda" autocomplete="off">
      </div>

      <div class="form-group">
        <label class="form-label" for="asalSekolah">Asal Sekolah</label>
        <input type="text" id="asalSekolah" class="form-input" placeholder="Nama sekolah asal Anda" autocomplete="off">
      </div>

      <div class="form-group">
        <label class="form-label" for="kelas">Kelas</label>
        <input type="text" id="kelas" class="form-input" placeholder="Nama kelas Anda" autocomplete="off">
      </div>

      <div class="form-group">
        <label class="form-label" for="minatSekolah">
          Sekolah yang Diminati
          <span class="badge-opsional">Opsional</span>
        </label>
        <input type="text" id="minatSekolah" class="form-input" placeholder="Sekolah yang ingin Anda tuju" autocomplete="off">
      </div>

      <button class="btn-submit" id="btnDaftar" onclick="daftarPengunjung()">
        KIRIM ▶ 
      </button>

      <div class="alert" id="alertMsg"></div>
    </div>

    <!-- List Card -->
    <!-- <div class="card">
      <div class="corner-deco tl"></div>
      <div class="corner-deco tr"></div>
      <div class="corner-deco bl"></div>
      <div class="corner-deco br"></div>

      <div class="card-title">Data Pengunjung</div>

      <div class="counter-bar">
        <span class="counter-label">Total Terdaftar</span>
        <span class="counter-num" id="counterNum">0</span>
      </div>

      <div class="list-panel" id="visitorList">
        <div class="loading-spinner">
          <div class="spinner"></div>
          <span>Memuat data...</span>
        </div>
      </div>
    </div> -->

  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-analytics.js";

  // ============================================================
  //   GANTI DENGAN KONFIGURASI FIREBASE PROJECT ANDA DI SINI
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyCNeUeZaVwm1CyREksD1hoOsTLM4sFtdvU",
    authDomain: "daftar-pengunjung-cc8d0.firebaseapp.com",
    projectId: "daftar-pengunjung-cc8d0",
    storageBucket: "daftar-pengunjung-cc8d0.firebasestorage.app",
    messagingSenderId: "839118866086",
    appId: "1:839118866086:web:0b97f96c07f4fd08319667",
    measurementId: "G-EBS6EP1BCR"
  };
  // ============================================================

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const analytics = getAnalytics(app);
  const colRef = collection(db, "pengunjung");

  // Expose ke global untuk onclick
  window.daftarPengunjung = async function () {
    const nama = document.getElementById('nama').value.trim();
    const asalSekolah = document.getElementById('asalSekolah').value.trim();
    const kelas = document.getElementById('kelas').value.trim();
    const minatSekolah = document.getElementById('minatSekolah').value.trim();
    const btn = document.getElementById('btnDaftar');
    const alert = document.getElementById('alertMsg');

    alert.className = 'alert';
    alert.style.display = 'none';

    if (!nama || !asalSekolah || !kelas) {
      alert.className = 'alert error';
      alert.textContent = '⚠ Nama dan Asal Sekolah wajib diisi.';
      alert.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = '⟳ Mendaftarkan...';

    try {
      await addDoc(colRef, {
        nama,
        asalSekolah,
        kelas,
        minatSekolah: minatSekolah || null,
        waktu: serverTimestamp()
      });

      document.getElementById('nama').value = '';
      document.getElementById('asalSekolah').value = '';
      document.getElementById('kelas').value = '';
      document.getElementById('minatSekolah').value = '';

      alert.className = 'alert success';
      alert.textContent = '✓ Registrasi berhasil! Selamat datang, ' + nama + '.';
      alert.style.display = 'block';

      setTimeout(() => { alert.style.display = 'none'; }, 4000);
    } catch (err) {
      alert.className = 'alert error';
      alert.textContent = '✗ Gagal menyimpan: ' + err.message;
      alert.style.display = 'block';
      console.error(err);
    }

    btn.disabled = false;
    btn.textContent = '▶ Daftarkan Saya';
  };

  // Realtime listener
  const q = query(colRef, orderBy("waktu", "desc"));
  onSnapshot(q, (snapshot) => {
    const list = document.getElementById('visitorList');
    const counter = document.getElementById('counterNum');
    const docs = snapshot.docs;

    counter.textContent = docs.length;

    if (docs.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">◎</div>
          <div class="empty-text">Belum ada pengunjung terdaftar</div>
        </div>`;
      return;
    }

    list.innerHTML = docs.map(doc => {
      const d = doc.data();
      const waktu = d.waktu?.toDate();
      const jam = waktu ? waktu.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) : '';
      return `
        <div class="visitor-item">
          <div class="visitor-time">${jam}</div>
          <div class="visitor-name">${escHtml(d.nama)}</div>
          <div class="visitor-detail">
            <span class="dot"></span>
            <span>${escHtml(d.asalSekolah)}</span>
          </div>
          <div class="visitor-detail">
            <span class="dot"></span>
            <span>${escHtml(d.kelas)}</span>
          </div>
          ${d.minatSekolah ? `
          <div class="visitor-minat">
            <span class="dot" style="background:var(--cyan-neon)"></span>
            <span>Minat: ${escHtml(d.minatSekolah)}</span>
          </div>` : ''}
        </div>`;
    }).join('');
  }, (err) => {
    document.getElementById('visitorList').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">⚠</div>
        <div class="empty-text" style="color:#ff6060">Gagal memuat data Firestore.<br>Periksa konfigurasi Firebase Anda.</div>
      </div>`;
    console.error(err);
  });

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
